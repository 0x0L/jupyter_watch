<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jupyter Watch</title>
  </head>
  <body>
    <header id="header">
      <span class="title">Jupyter Watch</span>
      <span class="viewer-label">Console</span>
      <div class="connection-info">
        <span
          id="status"
          class="status disconnected"
          role="img"
          aria-label="Kernel disconnected"
        ></span>
        <span id="status-label">Connecting</span>
        <button id="kernel-info" title="Waiting for connection filename"></button>
      </div>
      <div class="toolbar-controls">
        <button id="clear-output" title="Clear visible output">Clear</button>
        <label id="autoscroll-fab" title="Follow new output">
          <input type="checkbox" id="autoscroll-toggle" checked />
          Follow output
        </label>
        <details id="view-settings">
          <summary>View</summary>
          <div class="view-panel">
            <label class="wrap-option"
              ><input id="wrap-input" type="checkbox" /> Wrap input lines</label
            >
            <label for="input-language">Input language</label>
            <select id="input-language">
              <option value="python">Python</option>
              <option value="javascript">JavaScript</option>
              <option value="bash">Bash</option>
              <option value="json">JSON</option>
              <option value="plaintext">Plain text</option>
            </select>
          </div>
        </details>
        <button id="theme-fab" title="Toggle dark mode" aria-label="Toggle dark mode">
          <span id="theme-icon-sun" aria-hidden="true">☀︎</span>
          <span id="theme-icon-moon" aria-hidden="true" style="display: none">☾</span>
          Theme
        </button>
      </div>
    </header>
    <main id="notebook" aria-label="Kernel console output"></main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
